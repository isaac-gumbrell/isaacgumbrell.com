name: Update energy feed

# Refreshes _data/energy_feed.json for the Market Watch pages, then redeploys the site.
# Refreshes about every 12 hours. GitHub delays or drops scheduled runs when busy (a 10:00 UTC run
# once started 9 hours late, another never ran), so the schedule fires hourly at :17 and the "due"
# job lets the update through only when the feed is 11+ hours old. Manual runs always go ahead.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write # commit the refreshed feed
  actions: write # trigger the deploy workflow

concurrency:
  group: energy-feed
  cancel-in-progress: false

jobs:
  due:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Is the feed due for a refresh?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Every run commits the feed (generated_at always changes), so its last commit dates the last refresh.
          last=$(gh api "repos/${GITHUB_REPOSITORY}/commits?path=_data/energy_feed.json&per_page=1" -q '.[0].commit.committer.date')
          age=$(( $(date +%s) - $(date -d "${last:-1970-01-01T00:00:00Z}" +%s) ))
          echo "Feed last updated ${last:-never} ($((age / 3600)) h ago)"
          if [ "$age" -ge 39600 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

  update:
    needs: due
    if: needs.due.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/energy_feed/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/energy_feed/requirements.txt

      # AEMO and ASL refuse plain HTTP (Cloudflare) but serve a real browser; see browser_hosts in
      # scripts/energy_feed/config.yml. If Cloudflare challenges this runner, those sources fail
      # softly and the AEMO research beat still covers them.
      - name: Install headless Chromium
        run: python -m playwright install --with-deps chromium

      - name: Update feed
        env:
          # Set one of these as a repository secret (Settings > Secrets and variables > Actions).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Optional repository variables to change model/effort without editing code.
          ENERGY_FEED_MODEL: ${{ vars.ENERGY_FEED_MODEL }}
          ENERGY_FEED_EFFORT: ${{ vars.ENERGY_FEED_EFFORT }}
        run: python scripts/energy_feed/update_feed.py

      - name: Commit changes
        id: commit
        run: |
          git config user.name "energy-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/energy_feed.json scripts/energy_feed/state.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No feed changes."
          else
            git commit -m "Update energy feed [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the deploy explicitly.
      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
